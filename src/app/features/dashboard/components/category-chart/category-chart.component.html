<section class="chart" [attr.aria-label]="'chart.title' | t">
  <h2>{{ 'chart.title' | t }}</h2>

  @if (rows().length === 0) {
    <p class="empty">{{ 'chart.empty' | t }}</p>
  } @else {
    <ul>
      @for (row of rows(); track row.category) {
        <li>
          <span class="name">{{ row.category }}</span>
          <span class="track">
            <span class="bar" [style.width.%]="row.width"></span>
          </span>
          <span class="count">{{ row.count | number }}</span>
        </li>
      }
    </ul>
  }
</section>
