<header class="site-header">
  <a class="brand" routerLink="/dashboard">
    <span class="title">{{ 'app.brand' | t }}</span>
  </a>
  <div class="header-actions">
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">{{ 'app.dashboard' | t }}</a>
      <a routerLink="/menu" routerLinkActive="active">{{ 'app.menu' | t }}</a>
    </nav>
    <button type="button" class="theme-toggle" (click)="locale.toggle()">
      {{ 'lang.switch' | t }}
    </button>
    <button type="button" class="theme-toggle" (click)="theme.toggle()">
      {{ theme.labelKey() | t }}
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>
